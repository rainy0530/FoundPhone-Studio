<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f5f4f0" />
    <title>捡手机</title>
    <link rel="preload" as="image" href="./IMG_2380.jpg" fetchpriority="high" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Remove the old offline cache, which can keep showing outdated app icons
      // and lock-screen behavior after a successful GitHub Pages deployment.
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.getRegistrations().then(async (registrations) => {
          if (!registrations.length) return;
          await Promise.all(registrations.map((registration) => registration.unregister()));
          if ("caches" in window) {
            const keys = await caches.keys();
            await Promise.all(keys.map((key) => caches.delete(key)));
          }
          if (!sessionStorage.getItem("foundphone-cache-reset-v2")) {
            sessionStorage.setItem("foundphone-cache-reset-v2", "1");
            location.reload();
          }
        }).catch(() => {});
      }
    </script>
    <script type="module" src="/src/runtime/StoryPlayer.tsx"></script>
  </body>
</html>
